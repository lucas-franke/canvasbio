# Builds the static site and publishes it on GitHub Pages, at the custom domain lauterfrauen.de
# (Settings → Pages → Custom domain). One-time setup: Settings → Pages → Build and deployment →
# Source: "GitHub Actions".
# Without a custom domain the site lives at https://<owner>.github.io/<repo>/: set BASE_PATH to
# /${{ github.event.repository.name }}/ below.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The custom domain serves the site at the root.
      BASE_PATH: /
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
